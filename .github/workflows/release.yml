name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag and version files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs
      - name: Scan tracked source for high-confidence secrets
        shell: bash
        run: |
          if git grep -I -q -E '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})' -- .; then
            echo "High-confidence secret pattern detected in tracked source"
            exit 1
          fi

  build:
    needs: verify-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Ubuntu 26.04 Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xwayland
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Ubuntu 26.04 Debian package
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$HOME=/build"
          npm run tauri -- build --bundles deb -- --locked
          node scripts/normalize-ubuntu-deb.mjs
      - name: Verify Debian package contents
        shell: bash
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          dpkg-deb --info "$package"
          dpkg-deb --field "$package" Depends | grep -Fq 'libwebkit2gtk-4.1-0'
          dpkg-deb --field "$package" Depends | grep -Fq 'libgtk-3-0t64'
          dpkg-deb --field "$package" Depends | grep -Fq 'libayatana-appindicator3-1'
          dpkg-deb --field "$package" Depends | grep -Fq 'xwayland'
          for needle in "$GITHUB_WORKSPACE" "$HOME"; do
            if strings -a "$package" | grep -Fq "$needle"; then
              echo "Release package contains a local build path"
              exit 1
            fi
          done
          if dpkg-deb --contents "$package" | grep -E '(^|/)(\.env(?:\.[^/]*)?|auth\.json|credentials\.json|token\.json|target|screenshots?|.*\.log)(/|$)'; then
            echo "Release package contains a forbidden path"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: quota-float-ubuntu-26.04-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 90

  draft-release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quota-float-ubuntu-26.04-deb
          path: release-assets
      - name: Verify package and create checksum
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-assets/*.deb)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          dpkg-deb --field "$package" Depends | grep -Fq 'libgtk-3-0t64'
          (
            cd release-assets
            sha256sum "$(basename "$package")" > SHA256SUMS.txt
          )
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
          body_path: docs/RELEASE_TEMPLATE.md
          draft: true
          generate_release_notes: true
