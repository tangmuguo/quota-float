name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag and version files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs
      - name: Scan tracked source for high-confidence secrets
        shell: bash
        run: |
          if git grep -I -q -E '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})' -- .; then
            echo "High-confidence secret pattern detected in tracked source"
            exit 1
          fi

  desktop:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: quota-float-windows-unsigned
            archive-name: quota-float-windows-unsigned.zip
            build-command: npm run tauri -- build -- --locked
          - os: macos-latest
            artifact-name: quota-float-macos-universal-unsigned
            archive-name: quota-float-macos-universal-unsigned.zip
            build-command: npm run tauri -- build --target universal-apple-darwin -- --locked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build bundle without local paths
        shell: pwsh
        run: |
          $profilePath = [Environment]::GetFolderPath('UserProfile')
          $workspacePath = (Get-Location).Path
          $env:RUSTFLAGS = "--remap-path-prefix=$workspacePath=/src --remap-path-prefix=$profilePath=/build"
          ${{ matrix.build-command }}
      - name: Scan bundles for local build paths
        shell: pwsh
        run: |
          $profilePath = [Environment]::GetFolderPath('UserProfile')
          $workspacePath = (Get-Location).Path
          $needles = @(
            $profilePath,
            $profilePath.Replace('\', '/'),
            $workspacePath,
            $workspacePath.Replace('\', '/')
          ) | Select-Object -Unique
          $files = if ($IsWindows) {
            @(
              Get-Item src-tauri/target/release/quota-float.exe
              Get-ChildItem src-tauri/target/release/bundle -Recurse -File
            )
          } else {
            Get-ChildItem src-tauri/target/universal-apple-darwin/release/bundle -Recurse -File
          }
          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            $utf8 = [Text.Encoding]::UTF8.GetString($bytes)
            $utf16 = [Text.Encoding]::Unicode.GetString($bytes)
            foreach ($needle in $needles) {
              if ($utf8.Contains($needle) -or $utf16.Contains($needle)) {
                throw "Release bundle contains a local build path"
              }
            }
          }
      - name: Stage and archive Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-stage | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-stage/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-stage/
          $msiCount = @(Get-ChildItem release-stage -Filter *.msi).Count
          $exeCount = @(Get-ChildItem release-stage -Filter *-setup.exe).Count
          if ($msiCount -ne 1 -or $exeCount -ne 1) { throw "Expected one MSI and one NSIS installer" }
          Compress-Archive -Path release-stage/* -DestinationPath "${{ matrix.archive-name }}" -Force
      - name: Stage and archive macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir release-stage
          cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app release-stage/
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-stage/
          test "$(find release-stage -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" = "1"
          test "$(find release-stage -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" = "1"
          ditto -c -k --sequesterRsrc --keepParent release-stage "${{ matrix.archive-name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.archive-name }}
          if-no-files-found: error
          retention-days: 90

  ubuntu:
    needs: verify-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Ubuntu 26.04 Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xwayland
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build, unpack, and verify Ubuntu Debian package
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$HOME=/build"
          npm run tauri -- build --bundles deb -- --locked
          node scripts/normalize-ubuntu-deb.mjs
          node scripts/verify-ubuntu-deb.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quota-float-ubuntu-26.04-unsigned
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 90

  draft-release:
    needs: [desktop, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: quota-float-*-unsigned
          path: release-assets
          merge-multiple: true
      - name: Verify artifacts and create checksums
        shell: bash
        run: |
          test -f release-assets/quota-float-windows-unsigned.zip
          test -f release-assets/quota-float-macos-universal-unsigned.zip
          mapfile -t debs < <(find release-assets -maxdepth 1 -type f -name '*.deb')
          test "${#debs[@]}" -eq 1
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"

          windows_entries="$(unzip -Z1 release-assets/quota-float-windows-unsigned.zip)"
          test "$(grep -Ec '\.msi$' <<<"$windows_entries")" = "1"
          test "$(grep -Ec -- '-setup\.exe$' <<<"$windows_entries")" = "1"

          mac_entries="$(unzip -Z1 release-assets/quota-float-macos-universal-unsigned.zip | grep -Ev '(^|/)__MACOSX/|(^|/)\._')"
          test "$(grep -Ec '\.dmg$' <<<"$mac_entries")" = "1"
          test "$(grep -Ec '\.app/Contents/MacOS/' <<<"$mac_entries")" -ge "1"

          all_archive_entries="$(printf '%s\n%s\n' "$windows_entries" "$mac_entries")"
          if grep -Eiq '(^|/)(\.env(?:\.[^/]*)?|auth\.json|credentials\.json|token\.json|target|screenshots?|.*\.log)(/|$)' <<<"$all_archive_entries"; then
            echo "Release archive contains a forbidden path"
            exit 1
          fi

          dpkg-deb --field "${debs[0]}" Version | grep -Fxq "${GITHUB_REF_NAME#v}"
          (
            cd release-assets
            sha256sum quota-float-windows-unsigned.zip quota-float-macos-universal-unsigned.zip "$(basename "${debs[0]}")" > SHA256SUMS.txt
          )
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/quota-float-windows-unsigned.zip
            release-assets/quota-float-macos-universal-unsigned.zip
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
          body_path: docs/RELEASE_TEMPLATE.md
          draft: true
          generate_release_notes: true
